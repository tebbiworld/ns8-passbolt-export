#
# Restic include patterns (paths relative to /srv). state/passwords.env (the
# Passbolt account key, its passphrase and TOTP secret, the KeePass password
# and key file) is deliberately NOT backed up: whoever holds the backup
# repository password could otherwise read everything the export account can
# read. A restored instance asks for these secrets again. rclone/rclone.conf
# (login of the upload target) stays in the backup: without the KeePass
# password the files on the target are of no use. runs.json is the run
# history shown on the status page.
#
state/environment
state/rclone/rclone.conf
state/runs.json
